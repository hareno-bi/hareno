# Hareno API configuration for the dev stack (go run ./cmd/api -config dev/hareno.yaml).
# ${HARENO_PUBLIC_HOST} comes from the environment, default localhost.
# Dev-only credentials. Connections move to the application database in R1-4.
kiban:
  gateway: http://localhost:55440
  client_id: hareno-backend
  client_secret_file: dev/kiban/hareno-backend-secret   # written by dev/kiban/seed.sh
  realm: kiban
  login_client_id: kiban-frontend  # Kiban's public browser client
signin:                            # as the browser reaches them, through the demo proxy (dev/demo)
  public_url: http://${HARENO_PUBLIC_HOST}:55450
  kiban_url: http://${HARENO_PUBLIC_HOST}:55451
  demo_accounts:                   # shown on the sign-in page; seeded by dev/kiban/seed.sh. Never in production.
    - user: alice
      password: hareno-dev-password
      company: ALPHA
      via: "Position: North Regional Manager"
      sql: true
      rows: North
      share_data: true
      export: true
      remarks:
        - Limited rows (North only)
        - Builds and publishes dashboards
        - The only one who may share her data ("Sees my data")
    - user: bob
      password: hareno-dev-password
      company: ALPHA
      via: "Group: Finance"
      sql: true
      rows: All regions
      share_data: false
      export: false
      remarks:
        - All rows; compare with alice on the same dashboard
        - Builds dashboards, but may not share or download his data
    - user: erin
      password: hareno-dev-password
      company: ALPHA
      via: None
      sql: false
      rows: None
      share_data: false
      export: true
      remarks:
        - Same company, no data access of her own
        - Tests sharing; sees only what is shared with her
        - Shared by alice with "Sees my data", she sees North
        - "May download CSV, but gets only her own rows: none"
    - user: frank
      password: hareno-dev-password
      company: ALPHA
      via: "Direct grant"
      sql: false
      datasets: true
      rows: South
      share_data: false
      export: false
      remarks:
        - Limited rows (South only)
        - Builds dashboards from datasets, without writing SQL
    - user: carol
      password: hareno-dev-password
      company: BETA
      via: None in ALPHA
      sql: false
      rows: None
      share_data: false
      export: false
      remarks:
        - Another company
        - Tests the wall between companies
        - Can never see ALPHA dashboards, even if someone tries to share
  demo_links:                      # dashboards in the menu, by title (the ESG report demo). Never in production.
    - label: ESG report
      title: HSITP Sustainability Report FY2025/26 (mock data)
  demo_data:                       # the sample data table on the sign-in page. Never in production.
    connection: mart
    sql: |
      SELECT r.region_name AS region, o.order_id, to_char(o.ordered_at, 'YYYY-MM-DD') AS ordered, o.status,
             c.customer_name AS customer, c.segment, p.product_name AS product, p.category,
             li.quantity, li.unit_price, li.discount,
             round(li.quantity * li.unit_price * (1 - coalesce(li.discount, 0)), 2) AS amount
      FROM mart.fact_order o
      JOIN mart.dim_customer c USING (customer_id)
      JOIN mart.dim_region r USING (region_id)
      JOIN mart.fact_order_line li USING (order_id)
      JOIN mart.dim_product p USING (product_id)
      ORDER BY 1, 2, li.line_no
app_db: postgres://hareno:dev@localhost:55434/hareno
# Governed datasets: dashboard tiles built by picking fields and measures (P2-09). Start the
# compile sidecar first: (cd compiler && PORT=55436 node server.ts)
compiler: http://127.0.0.1:55436
datasets:
  - dev/mart/datasets/sales.yaml
  - dev/mart/datasets/customers.yaml
  - dev/mart/datasets/esg_utilities.yaml
  - dev/mart/datasets/esg_emissions.yaml
  - dev/mart/datasets/esg_waste.yaml
  - dev/mart/datasets/esg_people.yaml
  - dev/mart/datasets/esg_safety.yaml
  - dev/mart/datasets/esg_tenants.yaml
  - dev/mart/datasets/esg_community.yaml
  - dev/mart/datasets/esg_procurement.yaml
connections:
  mart:
    company: ALPHA                 # Kiban company code that owns it
    mode: database-enforced        # ARCHITECTURE-PLAN §5.3; fixed for the connection's life
    gate_dsn: postgres://hareno_gate:hareno_gate@localhost:55433/mart
    sql_role: hareno_sql
    timeout: 30s
    max_rows: 10000
    watermark: SELECT max(loaded_at) FROM mart.etl_watermark   # dashboards refresh when the mart loads (dev/mart/loader)
    refresh: 5s
    scope:                         # Kiban data_scope objects mart.region.<value> (or mart.region.*)
      region: [North, South, West]
