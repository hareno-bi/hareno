# The public demo under its domain name (dev/demo/edge.compose.yaml): Traefik ends TLS and sends
# requests here; they go on to the demo proxy on the host (dev/demo/nginx.conf.template, :55450).
server {
    listen 80;
    client_max_body_size 2m;
    location / {
        proxy_pass http://host.docker.internal:55450;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;  # only Traefik's HTTPS entry point routes here
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;  # CSV downloads stream for up to 5 minutes
        proxy_buffering off;
    }
}
