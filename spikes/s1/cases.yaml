# S1 golden cases. Expected values: dev/mart/known-answers.sql (hand-computed), except C20-C21.
# Each engine entry: queries (each with q and expect rows, or reject: true) or unsupported: reason.
# Numbers compare at the expected value's decimal scale; "2026-01"-style strings match date prefixes.

- id: C01
  title: total revenue (complete)
  malloy:
    queries:
      - q: "run: complete -> { aggregate: revenue }"
        expect: [[587.75]]
  metricflow:
    queries:
    - q: --metrics revenue --where "{{ Dimension('sales_order__status') }} = 'complete'"
      expect:
      - - 587.75

- id: C02
  title: orders / distinct customers / lines
  malloy:
    queries:
      - q: "run: complete -> { aggregate: order_count, customer_count, line_count }"
        expect: [[7, 4, 13]]
  metricflow:
    queries:
    - q: --metrics order_count,customer_count,line_count --where "{{ Dimension('sales_order__status') }} = 'complete'"
      expect:
      - - 7
        - 4
        - 13

- id: C03
  title: revenue by region
  malloy:
    queries:
      - q: "run: complete -> { group_by: region_name; aggregate: revenue; order_by: region_name }"
        expect: [[North, 238.50], [South, 175.50], [West, 173.75]]
  metricflow:
    queries:
    - q: --metrics revenue --group-by sales_order__customer__region_name --order sales_order__customer__region_name --where "{{ Dimension('sales_order__status') }} = 'complete'"
      expect:
      - - North
        - '238.50'
      - - South
        - '175.50'
      - - West
        - '173.75'

- id: C04
  title: fan-out trap, order-grain shipping with line revenue in one query
  malloy:
    queries:
      - q: "run: complete -> { aggregate: shipping, revenue }"
        expect: [[42.75, 587.75]]
  metricflow:
    queries:
    - q: --metrics shipping,revenue --where "{{ Dimension('sales_order__status') }} = 'complete'"
      expect:
      - - '42.75'
        - '587.75'

- id: C05
  title: shipping by region (dimension on the one side)
  malloy:
    queries:
      - q: "run: complete -> { group_by: region_name; aggregate: shipping; order_by: region_name }"
        expect: [[North, 15.50], [South, 19.25], [West, 8.00]]
  metricflow:
    queries:
    - q: --metrics shipping --group-by customer__region__region_name --order customer__region__region_name --where "{{ Dimension('sales_order__status') }} = 'complete'"
      expect:
      - - North
        - '15.50'
      - - South
        - '19.25'
      - - West
        - '8.00'

- id: C06
  title: shipping by product category must be rejected (no allocation rule)
  malloy:
    queries:
      - q: "run: complete -> { group_by: category; aggregate: shipping }"
        reject: true
  metricflow:
    queries:
    - q: --metrics shipping --group-by product__category --where "{{ Dimension('sales_order__status') }} = 'complete'"
      reject: true

- id: C07
  title: null measure, avg ignores nulls, count(column) vs count(*)
  malloy:
    queries:
      - q: "run: complete -> { aggregate: avg_shipping, order_count, orders_with_shipping }"
        expect: [[7.1250, 7, 6]]
  metricflow:
    queries:
    - q: --metrics avg_shipping,order_count,orders_with_shipping --where "{{ Dimension('sales_order__status') }} = 'complete'"
      expect:
      - - '7.1250'
        - 7
        - 6

- id: C08
  title: null dimension value is its own group
  malloy:
    queries:
      - q: "run: complete -> { group_by: customer.segment; aggregate: revenue; order_by: segment }"
        expect: [[Enterprise, 186.00], [SMB, 226.25], [null, 175.50]]
  metricflow:
    queries:
    - q: --metrics revenue --group-by sales_order__customer__segment --order sales_order__customer__segment --where "{{ Dimension('sales_order__status') }} = 'complete'"
      expect:
      - - Enterprise
        - '186.00'
      - - SMB
        - '226.25'
      - - null
        - '175.50'

- id: C09
  title: distinct count is not additive across categories
  malloy:
    queries:
      - q: "run: complete -> { group_by: category; aggregate: customer_count; order_by: category }"
        expect: [[Accessories, 2], [Hardware, 4], [Services, 3]]
      - q: "run: complete -> { aggregate: customer_count }"
        expect: [[4]]
  metricflow:
    queries:
    - q: --metrics line_customer_count --group-by product__category --order product__category --where "{{ Dimension('sales_order__status') }} = 'complete'"
      expect:
      - - Accessories
        - 2
      - - Hardware
        - 4
      - - Services
        - 3
    - q: --metrics customer_count --where "{{ Dimension('sales_order__status') }} = 'complete'"
      expect:
      - - 4

- id: C10
