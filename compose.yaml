# Hareno local development stack.
services:
  mart:
    image: postgres:18.0
    environment:
      POSTGRES_DB: mart
      POSTGRES_PASSWORD: dev  # dev-only
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - ./dev/mart/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "mart"]
      interval: 2s
      retries: 30

  appdb:
    image: postgres:18.0
    environment:
      POSTGRES_DB: hareno
      POSTGRES_USER: hareno
      POSTGRES_PASSWORD: dev  # dev-only
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - appdb:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hareno", "-d", "hareno"]
      interval: 2s
      retries: 30

  cache:
    image: valkey/valkey:8.1.4
    command: ["valkey-server", "--save", "", "--appendonly", "no"]  # result cache: nothing to persist
    ports:
      - "127.0.0.1:55435:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      retries: 30

  # Public demo of the built frontend (web/dist), on every interface: `docker compose --profile demo up -d demo`.
  # Static files only; nothing else in this file is published beyond localhost.
  demo:
    image: nginx:1.29.1-alpine
    profiles: ["demo"]
    restart: unless-stopped
    ports:
      - "0.0.0.0:55450:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./dev/demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  appdb:
