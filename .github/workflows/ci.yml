name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  # Go against the real compile sidecar and the dev mart (HARENO_INTEGRATION tests).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: compiler/package-lock.json
      - run: npm ci
        working-directory: compiler
      - run: docker compose up -d --wait mart appdb
      - run: go test ./...
        env:
          HARENO_INTEGRATION: "1"

  compiler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: compiler/package-lock.json
      - run: npm ci
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: node --test scripts/check-licenses.test.mjs
      - run: node scripts/check-licenses.mjs compiler/package-lock.json web/package-lock.json
      - run: go install github.com/google/go-licenses/v2@v2.0.1
      - run: >
          go-licenses check ./... --ignore github.com/hareno-bi/hareno
          --allowed_licenses="$(grep -v '^#' scripts/allowed-licenses.txt | paste -sd,)"

  mart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: dev/mart/check.sh
